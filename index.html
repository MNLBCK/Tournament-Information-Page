<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnier-Auswahl | Spieltag-Info</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=2026-10-22-cards11" />
  </head>
  <body>
    <header class="card hero">
      <div class="hero-headline site-brand">
        <img class="site-logo" src="favicon.svg" alt="Spieltag-Info Logo" />
        <div>
          <h1>Spieltag-Info</h1>
          <p>Turniere finden und öffnen.</p>
        </div>
      </div>
    </header>

    <main>
      <section class="card selector-search">
        <h2>Suche</h2>
        <div class="date-filter">
          <label for="tournamentDate">Datum:</label>
          <input id="tournamentDate" type="date" aria-label="Turnierdatum auswählen" />
        </div>
        <form id="tournamentSearchForm" class="tournament-search-row" role="search">
          <label for="tournamentSearch">Turnier:</label>
          <div class="tournament-search-input-wrap">
            <input id="tournamentSearch" type="search" placeholder="Turnier, Ort, Veranstalter" autocomplete="off" />
            <button type="submit" class="tournament-search-button" aria-label="Turniere suchen" title="Turniere suchen">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false">
                <circle cx="10.8" cy="10.8" r="6.5" /><path d="m15.5 15.5 5 5" />
              </svg>
            </button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 id="tournamentResultsHeading">Vorschläge</h2>
        <p class="hint" id="locationStatus">Standort wird für Vorschläge genutzt (optional).</p>
        <div id="tournamentCards" class="tournament-grid"></div>
      </section>
    </main>

    <footer><small>GitHub Pages kompatible, statische Website. <a href="admin.html">Event-Verwaltung</a></small></footer>

    <script type="module" src="script.js?v=2026-10-22-cards11"></script>
  </body>
</html>
